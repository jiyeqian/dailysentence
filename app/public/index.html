<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="每日一句海报">
<meta name="description" content="把欧路词典「每日一句」合成一张可保存的手机海报">
<title>每日一句 · 海报生成器</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 舞台：整屏只有海报。单击图片 / 信息卡 = 从相册选图；双击句子 = 隐藏；长按 = 保存 -->
<div id="stage">
  <div class="canvas-wrap">
    <canvas id="poster" width="1080" height="1920"></canvas>
    <div id="overlay" class="overlay"><div class="spinner"></div><span id="overlayText">加载中…</span></div>
  </div>

  <!-- 语音波形层（播放期独占，2026-09-22）：位置由 JS 按 3 区（英文句 en）的画布框
       换算成屏幕坐标写入。这里 pointer-events:none —— 它不抢任何事件，点它时事件照旧
       落到海报上，由手势层按几何判定「是否点在波形框内」。面板里不放任何文字 / 图标：
       波形本身就是停止按钮。 -->
  <div id="wave" hidden><div class="wave-bars" id="waveBars" aria-hidden="true"></div></div>

  <!-- 调整模式遮罩（换图后的手动调整，2026-09-22）：正在调的那块会被平移到屏幕中央，
       这里只负责「中间透明、四周压暗」，洞的位置由 JS 按该区当前的屏幕 rect 写入。
       亮暗交界就是这块区域的边界 —— 刻意不描边、不加虚线。
       pointer-events:none：不抢事件，拖动与双指缩放照旧落在海报上由手势层处理。 -->
  <div id="editMask" hidden></div>
</div>

<!-- 相册选图入口：单击海报上的顶部图片 / 信息卡时由 JS 触发 -->
<input id="fBgImage" type="file" accept="image/*" hidden>
<input id="fCardImage" type="file" accept="image/*" hidden>

<!-- 首次进入的一次性手势提示（3 秒后 / 任意操作立即消失，不做记忆） -->
<p id="hint" class="hint" hidden>长按保存 · 下拉更新 · 点英文句朗读 · 点日期看昨天</p>

<!-- 保存浮层：iOS 专用通道。Safari 上 <a download> 只会落进「文件」里弹 Quick Look
     预览（存不进相册），而 navigator.share 在长按的定时器里已脱离手势调用栈会被拒。
     唯一稳的路是「长按这张图 → 存储到照片」，所以这里给一张能长按的原图。点空白处关闭。 -->
<div id="saveSheet" hidden>
  <img id="saveImg" alt="每日一句海报">
  <p id="saveTip">长按图片 → 存储到照片</p>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
