<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="每日一句海报">
<meta name="description" content="把欧路词典「每日一句」合成一张可保存的手机海报">
<title>每日一句 · 海报生成器</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 舞台：整屏只有海报。单击图片 / 信息卡 = 从相册选图；双击句子 = 隐藏；长按 = 保存 -->
<div id="stage">
  <div class="canvas-wrap">
    <canvas id="poster" width="1080" height="1920"></canvas>
    <div id="overlay" class="overlay"><div class="spinner"></div><span id="overlayText">加载中…</span></div>
  </div>
</div>

<!-- 顶栏：只有四个动作 -->
<header class="topbar" id="topbar">
  <button id="btnPlay" class="icon-btn" title="朗读" aria-label="朗读">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8.2v3.6h2.7L10.5 15V5L6.7 8.2H4z" fill="currentColor"/><path d="M13.5 8a4.6 4.6 0 0 1 0 4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <button id="btnBg" class="icon-btn wide" title="背景比例" aria-label="背景比例"><span id="bgLabel">原比例</span></button>
  <button id="btnRefresh" class="icon-btn" title="重新获取" aria-label="重新获取">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.6 7A6.4 6.4 0 1 0 16.3 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16.2 3.6v3.9h-3.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="btnSave" class="icon-btn primary" title="保存海报" aria-label="保存海报">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.4v8.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M6.6 8.6 10 12l3.4-3.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.2 16h11.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
</header>

<!-- 相册选图入口：单击海报上的顶部图片 / 信息卡时由 JS 触发 -->
<input id="fBgImage" type="file" accept="image/*" hidden>
<input id="fCardImage" type="file" accept="image/*" hidden>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
