<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="每日一句海报">
<meta name="description" content="把欧路词典「每日一句」合成一张可保存的手机海报">
<title>每日一句 · 海报生成器</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 舞台：海报铺满整屏，可点即改 -->
<div id="stage">
  <div class="canvas-wrap">
    <canvas id="poster" width="1080" height="1920"></canvas>
    <div id="overlay" class="overlay"><div class="spinner"></div><span id="overlayText">加载中…</span></div>
  </div>
</div>

<!-- 引导呼吸框（叠加在 canvas 上，pointer-events: none） -->
<div id="frames" class="frames" aria-hidden="true"></div>
<div id="mark" class="mark" hidden aria-hidden="true"></div>
<p id="tip" class="tip" hidden><span id="tipText"></span></p>

<!-- 顶栏：只有四个动作（外加“你在看哪一天”的小标） -->
<header class="topbar" id="topbar">
  <button id="srcTag" class="src-tag" hidden title="往期存档" aria-label="往期存档">今天</button>
  <button id="btnPlay" class="icon-btn" title="朗读" aria-label="朗读">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8.2v3.6h2.7L10.5 15V5L6.7 8.2H4z" fill="currentColor"/><path d="M13.5 8a4.6 4.6 0 0 1 0 4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <button id="btnBg" class="icon-btn wide" title="背景比例" aria-label="背景比例"><span id="bgLabel">原比例</span></button>
  <button id="btnRefresh" class="icon-btn" title="重新获取" aria-label="重新获取">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.6 7A6.4 6.4 0 1 0 16.3 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16.2 3.6v3.9h-3.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="btnSave" class="icon-btn primary" title="保存海报" aria-label="保存海报">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.4v8.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M6.6 8.6 10 12l3.4-3.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.2 16h11.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
</header>

<!-- 就地浮框：内容从下面的控件仓库按需搬进来 -->
<div id="pop" class="pop" hidden>
  <div class="pop-head"><b id="popTitle">关键词</b><button id="popClose" class="pop-close" aria-label="关闭">✕</button></div>
  <div class="pop-body" id="popBody"></div>
  <p class="pop-hint" id="popHint"></p>
</div>

<!-- 控件仓库：不显示，浮框打开时把对应那一组搬进 #popBody -->
<div id="kit" hidden>

  <div class="k" data-k="word">
    <label class="field"><span>关键词</span><input id="fWord" type="text" placeholder="如 never，改完自动重查词典"></label>
    <div id="fixCard" hidden>
      <p class="note" id="fixNote"></p>
      <div class="chips" id="segWord"></div>
    </div>
  </div>

  <div class="k" data-k="text">
    <label class="field"><span>英文</span><textarea id="fEn" rows="2"></textarea></label>
    <label class="field"><span>中文</span><textarea id="fCn" rows="2"></textarea></label>
  </div>

  <div class="k" data-k="source">
    <label class="field"><span>出处</span><input id="fSource" type="text" placeholder="如 文森特·威廉·梵高"></label>
  </div>

  <div class="k" data-k="defs">
    <label class="field"><span>释义</span><textarea id="fDefs" rows="3" placeholder="每行一条，如：n.冲动；脉冲"></textarea></label>
  </div>

  <div class="k" data-k="card">
    <label class="switch"><input id="cLong" type="checkbox"><span>长版海报（附例句）</span></label>
    <button id="btnTemplate" class="btn ghost full">更换个人信息卡模板</button>
    <input id="fTemplate" type="file" accept="image/*" hidden>
  </div>

  <div class="k" data-k="archive">
    <p class="note" id="archNote"></p>
    <div class="archlist" id="archList"></div>
  </div>

  <div class="k" data-k="page">
    <div class="seg" id="segBg">
      <button data-v="natural" class="on">原比例</button>
      <button data-v="cover">铺满</button>
    </div>
    <label class="field range"><span>字号</span><input id="rFont" type="range" min="80" max="120" value="100"><b id="vFont">100%</b></label>
    <label class="field range"><span>上边距</span><input id="rTop" type="range" min="25" max="80" value="59"><b id="vTop">59%</b></label>
    <label class="field range"><span>卡片高度</span><input id="rH" type="range" min="10" max="40" value="26"><b id="vH">26%</b></label>
    <label class="field range"><span>左右边距</span><input id="rM" type="range" min="0" max="12" value="4"><b id="vM">4%</b></label>
    <label class="switch"><input id="cDate" type="checkbox" checked><span>日期标签</span></label>
    <label class="switch"><input id="cRule" type="checkbox" checked><span>标题分隔线</span></label>
    <label class="switch"><input id="cSource" type="checkbox" checked><span>显示出处</span></label>
    <footer class="foot"><a id="linkSource" href="https://dict.eudic.net/home/dailysentence" target="_blank" rel="noopener">打开欧路词典原网页</a></footer>
  </div>

</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
